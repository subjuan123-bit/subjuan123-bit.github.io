<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="shell">
  <header class="guide">
    <div class="wrap">
      <button class="mini" id="miniCard" data-nav aria-label="Open profile">
        <span class="av" id="miniAv"><span class="mono" style="font-size:15px">SA</span></span>
        <span class="who"><span class="tag">Sebastian Acendra</span><span class="gs"><span class="gglyph">G</span><span id="miniGs">0</span></span></span>
      </button>
      <nav class="pivots" aria-label="Sections">
        <span class="bumper" aria-hidden="true">Q</span>
        <button class="pivot" data-tab="home" data-nav>Home</button>
        <button class="pivot" data-tab="achievements" data-nav>Achievements</button>
        <button class="pivot" data-tab="profile" data-nav>Profile</button>
        <button class="pivot" data-tab="resume" data-nav>Resume</button>
        <span class="bumper" aria-hidden="true">E</span>
      </nav>
      <div class="sys">
        <button class="iconbtn" id="muteBtn" data-nav aria-pressed="false"></button>
        <span class="clock" id="clock"></span>
      </div>
    </div>
  </header>

  <main>
    <section class="view wrap" id="v-home" aria-label="Home"></section>
    <section class="view wrap" id="v-achievements" aria-label="Achievements" hidden></section>
    <section class="view wrap" id="v-profile" aria-label="Profile" hidden></section>
    <section class="view wrap" id="v-resume" aria-label="Resume" hidden></section>
    <section class="view wrap" id="v-project" aria-label="Project" hidden></section>
  </main>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lbtop">
    <span class="lbcount" id="lbCount"></span>
    <button class="backbtn" id="lbClose" data-lnav><span class="pad b">B</span>Close</button>
  </div>
  <div class="lbstage">
    <button class="lbnav" id="lbPrev" data-lnav aria-label="Previous photo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg></button>
    <figure><img id="lbImg" alt=""></figure>
    <button class="lbnav" id="lbNext" data-lnav aria-label="Next photo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="lbcap"><span id="lbCap"></span><button class="iconbtn" id="lbRemove" data-lnav hidden>Remove photo</button></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="filePick" accept="image/*" multiple hidden>

<footer class="legend" aria-hidden="true">
  <div class="wrap">
    <span><kbd>←↑↓→</kbd> Move</span>
    <span><span class="pad a">A</span><kbd>Enter</kbd> Select</span>
    <span><span class="pad b">B</span><kbd>Esc</kbd> Back</span>
    <span><span class="pad bump">LB RB</span><kbd>Q / E</kbd> Sections</span>
    <span><kbd>M</kbd> Sound</span>
  </div>
</footer>
<script src="assets/content.js"></script>
<script src="assets/media.js"></script>
<script src="assets/app.js"></script>
</body>
